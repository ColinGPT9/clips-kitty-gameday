name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: ffmpeg and the title card font (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-dejavu-core
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  lightsail:
    name: Lightsail setup script (Ubuntu 24.04, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run the setup script as on a fresh server
        run: sudo bash scripts/setup-lightsail.sh localhost
      - name: The app answers, directly and through Caddy, and asks for the password
        run: |
          curl -fsS http://127.0.0.1:8080/health
          curl -fsSk https://localhost/health
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/status)" = 401
      - name: The judge login reads the API, and can't change the settings
        run: |
          judge="$(sudo sed -n 's/^GAMEDAY_JUDGE_PASSWORD=//p' /etc/gameday.env)"
          test -n "$judge"
          echo "::add-mask::$judge"
          role="$(curl -fsSk -u "judge:$judge" https://localhost/api/status | python3 -c 'import json, sys; print(json.load(sys.stdin)["role"])')"
          test "$role" = judge
          test "$(curl -sk -o /dev/null -w '%{http_code}' -u "judge:$judge" -X PATCH -H 'X-Gameday-Action: 1' \
            -H 'Content-Type: application/json' -d '{"max_clips": 3}' https://localhost/api/settings)" = 403
      - name: Running the script again keeps both passwords
        run: |
          before="$(sudo sha256sum /etc/gameday.env)"
          sudo bash scripts/setup-lightsail.sh localhost > /dev/null
          test "$(sudo sha256sum /etc/gameday.env)" = "$before"
      - name: An env file from before the judge login keeps its owner password and gets a judge one
        run: |
          owner="$(sudo grep '^GAMEDAY_PASSWORD=' /etc/gameday.env | sha256sum)"
          sudo sed -i '/^GAMEDAY_JUDGE_PASSWORD=/d' /etc/gameday.env
          sudo bash scripts/setup-lightsail.sh localhost > /dev/null
          test "$(sudo grep '^GAMEDAY_PASSWORD=' /etc/gameday.env | sha256sum)" = "$owner"
          test "$(sudo grep -c '^GAMEDAY_JUDGE_PASSWORD=' /etc/gameday.env)" = 1
          test "$(sudo stat -c '%a %U' /etc/gameday.env)" = "600 root"
          judge="$(sudo sed -n 's/^GAMEDAY_JUDGE_PASSWORD=//p' /etc/gameday.env)"
          echo "::add-mask::$judge"
          curl -fsSk -o /dev/null -u "judge:$judge" https://localhost/api/status
      - name: The tests on the server's Python
        run: |
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/python -m pytest -q
      - name: Drive sync script, with a local folder standing in for Google Drive
        run: |
          sudo apt-get install -y -q rclone
          # The real setup's config line (the token is fake; no network is needed to save it).
          rclone config create cicheck drive scope=drive.readonly \
            token='{"access_token":"x","token_type":"Bearer","refresh_token":"y","expiry":"2030-01-01T00:00:00Z"}' --non-interactive
          rclone listremotes | grep -qx 'cicheck:' && rclone config delete cicheck
          # "gdrive" points at a local folder here, so the script finds a remote and asks no token.
          mkdir -p "$RUNNER_TEMP/fake-drive/Game Day"
          printf 'not really a video' > "$RUNNER_TEMP/fake-drive/Game Day/game one.mp4"
          printf 'ignored' > "$RUNNER_TEMP/fake-drive/Game Day/notes.txt"
          rclone config create gdrive alias remote="$RUNNER_TEMP/fake-drive"
          sudo bash scripts/setup-drive-sync.sh "Game Day"
          sleep 3
          test -f "/srv/gameday-watch/game one.mp4"
          test ! -e /srv/gameday-watch/notes.txt
          systemctl is-active --quiet gameday-drive.timer

  relay:
    name: Relay (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: meta-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: node:sqlite works with --experimental-sqlite
        run: node --experimental-sqlite --no-warnings -e "const { DatabaseSync } = require('node:sqlite'); new DatabaseSync(':memory:').exec('CREATE TABLE t (x)'); console.log('node:sqlite works on', process.version)"
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Tests
        run: npm test

  provenance:
    name: Provenance (no code from before the event)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      REFERENCE_REPO: https://github.com/ColinGPT9/clips-studio
      REFERENCE_REV: 6245e02332ba07e0c9b12d47a95ee81502f4122d
    steps:
      - uses: actions/checkout@v7
      - name: Fetch clips-studio at the commit the event started from, without checking it out
        run: |
          ref="$RUNNER_TEMP/clips-studio"
          git clone --quiet --filter=blob:none --no-checkout "$REFERENCE_REPO" "$ref"
          git -C "$ref" fetch --quiet --filter=blob:none origin "$REFERENCE_REV"
          # The files the check reads, in one fetch instead of one lazy fetch each.
          python3 scripts/provenance_check.py --reference "$ref" --rev "$REFERENCE_REV" --list-blobs |
            git -C "$ref" -c fetch.negotiationAlgorithm=noop fetch --quiet --no-tags --no-write-fetch-head \
              --recurse-submodules=no --filter=blob:none --stdin origin
      - name: Check
        run: python3 scripts/provenance_check.py --reference "$RUNNER_TEMP/clips-studio" --rev "$REFERENCE_REV"
